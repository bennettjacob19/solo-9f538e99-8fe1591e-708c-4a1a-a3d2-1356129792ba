<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>目录运维迁移 · 熔断网关</title>
<style>
  :root {
    --bg: #0f1420; --panel: #18202f; --line: #2a3550; --text: #e6ebf5;
    --muted: #8fa0bd; --accent: #4f8cff; --ok: #2fbf71; --warn: #e8a13a;
    --bad: #e5484d; --chip: #22304a;
  }
  * { box-sizing: border-box; }
  body { margin: 0; font: 14px/1.55 -apple-system, "Segoe UI", Roboto, "PingFang SC",
         "Microsoft YaHei", sans-serif; background: var(--bg); color: var(--text); }
  header { padding: 18px 24px; border-bottom: 1px solid var(--line);
           display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap; }
  header h1 { font-size: 18px; margin: 0; }
  header .sub { color: var(--muted); font-size: 12px; }
  main { padding: 20px 24px 60px; display: grid; gap: 18px;
         grid-template-columns: repeat(2, minmax(0, 1fr)); max-width: 1280px; }
  .card { background: var(--panel); border: 1px solid var(--line);
          border-radius: 10px; padding: 16px 18px; min-width: 0; }
  .card.wide { grid-column: 1 / -1; }
  .card h2 { font-size: 14px; margin: 0 0 12px; color: var(--accent);
             letter-spacing: .5px; text-transform: uppercase; }
  label { display: block; font-size: 12px; color: var(--muted); margin: 8px 0 3px; }
  input, select { width: 100%; padding: 8px 10px; border-radius: 6px;
                  border: 1px solid var(--line); background: #111827; color: var(--text); }
  button { padding: 8px 14px; border-radius: 6px; border: 1px solid var(--accent);
           background: var(--accent); color: #fff; cursor: pointer; font-weight: 600; }
  button.secondary { background: transparent; color: var(--accent); }
  button.danger { border-color: var(--bad); background: var(--bad); }
  button:disabled { opacity: .45; cursor: not-allowed; }
  .row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  .row > * { flex: 1; }
  .row .narrow { flex: 0 0 110px; }
  .chip { display: inline-block; padding: 2px 9px; border-radius: 999px;
          background: var(--chip); font-size: 12px; font-weight: 600; }
  .chip.CLOSED { background: rgba(47,191,113,.18); color: var(--ok); }
  .chip.OPEN, .chip.HALF_OPEN { background: rgba(229,72,77,.18); color: var(--bad); }
  .chip.HALF_OPEN { background: rgba(232,161,58,.2); color: var(--warn); }
  table { width: 100%; border-collapse: collapse; font-size: 12.5px; }
  th, td { text-align: left; padding: 7px 8px; border-bottom: 1px solid var(--line);
           vertical-align: top; word-break: break-all; }
  th { color: var(--muted); font-weight: 600; }
  pre { background: #0b101b; border: 1px solid var(--line); border-radius: 8px;
        padding: 10px 12px; overflow: auto; max-height: 320px; font-size: 12px; }
  .muted { color: var(--muted); font-size: 12px; }
  .ok { color: var(--ok); } .err { color: var(--bad); } .warn { color: var(--warn); }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  .dirbox { border: 1px solid var(--line); border-radius: 8px; padding: 12px; }
  .dirbox h3 { margin: 0 0 6px; font-size: 13px; }
  #toast { position: fixed; right: 20px; bottom: 20px; max-width: 480px; display: grid;
           gap: 8px; z-index: 10; }
  .toast-item { padding: 10px 14px; border-radius: 8px; background: #20304d;
                border: 1px solid var(--line); box-shadow: 0 6px 20px rgba(0,0,0,.4); }
  .toast-item.ok { border-color: var(--ok); }
  .toast-item.err { border-color: var(--bad); }
  .kv { display: grid; grid-template-columns: 130px 1fr; gap: 4px 10px; font-size: 12.5px; }
  .kv .k { color: var(--muted); }
  @media (max-width: 900px) { main { grid-template-columns: 1fr; } .grid2 { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<header>
  <h1>目录运维迁移 · 在线切换网关</h1>
  <span class="sub">预检 + 乐观版本切换 · 双 worker · 按 URL 隔离熔断 · 重启持久化</span>
  <span class="muted" style="margin-left:auto">每 2 秒自动刷新状态</span>
</header>

<main>
  <!-- 当前配置 -->
  <section class="card">
    <h2>当前配置</h2>
    <div class="kv" id="configView"><div class="k">加载中…</div><div></div></div>
  </section>

  <!-- 在飞查询 -->
  <section class="card">
    <h2>Worker 与在飞查询</h2>
    <div id="inflightView" class="muted">加载中…</div>
  </section>

  <!-- 切换表单 -->
  <section class="card wide">
    <h2>在线切换网关上游</h2>
    <div class="row">
      <div>
        <label>目标 URL</label>
        <input id="swUrl" value="http://directory-b:9000">
      </div>
      <div class="narrow">
        <label>预期目录标识</label>
        <input id="swId" value="directory-b">
      </div>
      <div class="narrow">
        <label>所见配置版号</label>
        <input id="swVersion" type="number" value="1">
      </div>
      <div class="narrow">
        <label>制品（可选，默认 example-app.json）</label>
        <input id="swArtifact" placeholder="example-app.json">
      </div>
    </div>
    <div class="row" style="margin-top:12px">
      <button id="btnPreflight" class="secondary">仅预检（不改熔断计数）</button>
      <button id="btnSwitch">预检并切换</button>
      <span class="muted">失败、版本冲突或写入失败时配置保持不变；版号以“当前配置”为准。</span>
    </div>
  </section>

  <!-- 查询 -->
  <section class="card wide">
    <h2>经网关查询目录</h2>
    <div class="row">
      <div>
        <label>制品名</label>
        <input id="qArtifact" value="example-app.json">
      </div>
      <div class="narrow">
        <label>并发次数</label>
        <input id="qConcurrency" type="number" value="1" min="1" max="20">
      </div>
      <div class="narrow" style="align-self:end">
        <button id="btnQuery">发起查询</button>
      </div>
    </div>
    <div id="queryResults" style="margin-top:12px"></div>
  </section>

  <!-- 目录实例控制 -->
  <section class="card wide">
    <h2>两个目录实例（可分别控制延迟与 503）</h2>
    <div class="grid2" id="dirPanels"><div class="muted">加载中…</div></div>
  </section>

  <!-- 熔断状态 -->
  <section class="card wide">
    <h2>各 URL 熔断状态（切回不清零，重启不丢失）</h2>
    <button class="secondary" id="btnResetBreakers" style="margin-bottom:10px">
      重置全部熔断状态（演示用）</button>
    <div id="breakerView" class="muted">加载中…</div>
  </section>
</main>

<div id="toast"></div>
<script src="/static/app.js"></script>
</body>
</html>
